:root{
  --paper:#E4E6E8;--sheet:#F4F5F6;--ink:#14171A;--mute:#565D64;--line:#C3C8CC;
  --rojo:#D6252B;--azul:#1D4FA0;--verde:#17783F;--amarillo:#F4C20D;
  --pad:20px;
}
*{box-sizing:border-box}
html{background:var(--paper);-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:450;font-stretch:100%;font-size:16px;line-height:1.4;color:var(--ink);background:var(--paper);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.disp{font-weight:900;font-stretch:125%;letter-spacing:-.025em;line-height:.96}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

#app{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:calc(16px + env(safe-area-inset-top)) var(--pad) 14px}
.top .fecha{font-weight:650;font-size:15px;color:var(--mute)}
.top .marca{font-weight:900;font-stretch:125%;letter-spacing:-.03em;font-size:20px}

/* barra de navegación */
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--ink);padding-bottom:env(safe-area-inset-bottom);z-index:5}
#nav button{flex:1;background:none;border:0;color:#98A0A6;font-weight:750;font-stretch:112%;font-size:15px;padding:18px 0 16px;cursor:pointer;position:relative}
#nav button[aria-current=page]{color:#fff}
#nav button[aria-current=page]::before{content:"";position:absolute;top:0;left:32%;right:32%;height:4px;background:var(--amarillo)}

/* botones */
.btn{display:block;width:100%;border:0;border-radius:14px;padding:18px 20px;font-weight:800;font-stretch:112%;font-size:18px;letter-spacing:-.01em;cursor:pointer;text-align:center}
.btn:active{transform:translateY(2px)}
.btn.ink{background:var(--ink);color:var(--sheet)}
.btn.verde{background:var(--verde);color:#fff}
.btn.suave{background:transparent;border:2px solid var(--ink);color:var(--ink)}
.txt{background:none;border:0;padding:12px;font-weight:700;font-size:16px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;width:100%;color:inherit}

/* hero: el disco del día */
.hero{background:var(--c);color:var(--t);padding:28px var(--pad) 30px;position:relative;overflow:hidden;border-radius:0 0 40px 0}
.hero::after{content:"";position:absolute;right:-120px;top:-70px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,var(--paper) 0 7%,transparent 7.4%),repeating-radial-gradient(circle,rgba(0,0,0,.17) 0 3px,transparent 3px 24px);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(34px,10.4vw,54px);max-width:9.5em;margin-bottom:14px}
.hero p{font-size:17px;font-weight:550;max-width:24em;margin-bottom:24px}

/* semana en franjas */
.week{display:flex;gap:6px;padding:22px var(--pad) 0}
.wd{flex:1;border:0;background:none;padding:0;cursor:pointer;text-align:center;font-weight:700;font-size:14px}
.wd i{display:block;height:56px;border-radius:10px;background:var(--c);opacity:.28;margin-bottom:8px;position:relative}
.wd.done i,.wd.hoy i{opacity:1}
.wd.done i::after{content:"";position:absolute;left:50%;top:44%;width:16px;height:9px;border-left:4px solid var(--t);border-bottom:4px solid var(--t);transform:translate(-50%,-50%) rotate(-45deg)}
.wd span{display:inline-block;padding-bottom:2px;border-bottom:3px solid transparent}
.wd.hoy span{border-color:var(--ink);font-weight:900}
.semtxt{padding:12px var(--pad) 0;color:var(--mute);font-weight:550;font-size:15px}

/* bloques de texto */
.bloque{padding:30px var(--pad) 0}
.bloque h2{font-size:15px;font-weight:700;color:var(--mute);margin-bottom:8px}
.kgbig{font-weight:900;font-stretch:125%;font-size:clamp(52px,16vw,76px);letter-spacing:-.04em;line-height:1}
.kgbig small{font-size:.38em;letter-spacing:-.01em;margin-left:6px;font-stretch:112%}
.barra{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:14px 0 8px}
.barra i{display:block;height:100%;background:var(--verde);border-radius:6px}
.link{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.hint{margin:22px var(--pad) 0;padding:14px 16px;background:var(--sheet);border-left:6px solid var(--azul);font-size:15px}
.hint button{margin-top:6px;background:none;border:0;padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* semana: franjas de colores */
.titulo{padding:calc(18px + env(safe-area-inset-top)) var(--pad) 18px;font-size:clamp(34px,10vw,48px)}
.band{display:block;width:100%;text-align:left;border:0;background:var(--c);color:var(--t);padding:16px var(--pad);cursor:pointer;margin-bottom:4px}
.band small{display:block;font-weight:650;font-size:14px;opacity:.88}
.band h3{margin-top:2px;font-size:clamp(20px,6vw,26px);font-stretch:118%;font-weight:850;letter-spacing:-.02em;line-height:1.05}
.detalle{background:var(--sheet);padding:4px 0 20px;margin-bottom:4px}
.ex{padding:16px var(--pad) 14px;border-bottom:1px solid var(--line)}
.ex b{display:block;font-size:17px;font-weight:750}
.ex .sub{color:var(--mute);font-size:14.5px;margin-top:2px}
.ex details{margin-top:8px}
.ex summary{font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;list-style:none}
.ex summary::-webkit-details-marker{display:none}
.ex ol{margin:10px 0 2px;padding-left:22px}
.ex li{margin-bottom:6px;font-size:15.5px}
.detalle .nota{padding:16px var(--pad) 8px;color:var(--mute);font-size:15px}
.detalle .btn{margin:14px var(--pad) 0;width:calc(100% - 2 * var(--pad))}

/* peso */
.filas{margin-top:6px}
.fila{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.fila b{font-weight:800;font-stretch:112%}
.msg{margin:20px 0 0;padding:14px 16px;background:var(--sheet);border-left:6px solid var(--c,var(--amarillo));font-weight:500}
.campo{display:flex;gap:10px;margin-top:10px}
.campo input{font:inherit;font-weight:800;font-stretch:112%;font-size:22px;padding:14px;border:2px solid var(--ink);border-radius:12px;background:var(--sheet);width:100%;min-width:0;color:var(--ink)}
.campo input[type=date]{font-size:17px;font-weight:650}
.graf{background:var(--sheet);border-radius:18px 18px 18px 4px;padding:12px 8px 6px;margin-top:10px}
.graf svg{display:block;width:100%;height:auto;font-size:11px;font-family:inherit;fill:var(--mute)}
.hist{margin-top:6px}
.hist .fila{align-items:center}
.hist button{background:none;border:0;font-weight:650;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:var(--mute);padding:6px 0 6px 10px}
details.aj{margin-top:26px;border-top:2px solid var(--ink);padding-top:12px}
details.aj summary{font-weight:800;font-stretch:112%;cursor:pointer;padding:6px 0}
details.aj label{display:block;margin-top:14px;font-weight:650;font-size:15px}
details.aj .campo{margin-top:6px}
details.aj textarea{width:100%;min-height:90px;margin-top:8px;font:inherit;font-size:14px;padding:10px;border:2px solid var(--ink);border-radius:12px;background:var(--sheet);color:var(--ink)}
.sep{height:10px}

/* sesión en pantalla completa */
#ses{position:fixed;inset:0;z-index:20;display:none;overflow:auto;background:var(--ink)}
#ses.on{display:block}
.s{min-height:100%;display:flex;flex-direction:column}
.s.work,.s.fin,.s.cardio{background:var(--c);color:var(--t)}
.s.rest{background:var(--ink);color:#fff}
.stop{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) var(--pad) 8px}
.stop button{background:none;border:0;font-weight:750;font-size:16px;padding:10px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.stop .reloj{font-weight:900;font-stretch:118%;font-size:22px;letter-spacing:-.02em}
.seg{display:flex;gap:4px;padding:0 var(--pad)}
.seg i{flex:1;height:7px;border-radius:4px;background:rgba(0,0,0,.2)}
.seg i.d{background:var(--ink)}
.seg i.c{background:var(--t)}
.cabeza{padding:22px var(--pad) 12px;flex:1}
.cabeza .grupo{font-weight:700;font-size:16px;margin-bottom:6px;opacity:.9}
.cabeza h2{font-size:clamp(30px,9.4vw,46px)}
.barra-disco{margin:20px 0 10px}
.barra-disco svg{display:block;width:100%;height:auto;max-height:110px}
.cabeza .serie{font-weight:750;font-size:18px;font-stretch:108%}
.pie{background:var(--sheet);color:var(--ink);padding:20px var(--pad) calc(18px + env(safe-area-inset-bottom));border-radius:30px 30px 0 0}
.pie ol{margin:0 0 18px;padding-left:22px;max-width:36em}
.pie li{margin-bottom:8px;font-size:16px;line-height:1.35}
.pie .btn+.txt{margin-top:4px}

.s.rest .medio{flex:1;padding:30px var(--pad) 0;display:flex;flex-direction:column;justify-content:center}
.s.rest .lbl{font-weight:700;font-size:18px;color:var(--cl);margin-bottom:6px}
.big{font-weight:900;font-stretch:125%;font-size:clamp(92px,31vw,156px);letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.drain{height:12px;background:rgba(255,255,255,.16);border-radius:6px;overflow:hidden;margin:22px 0 26px}
.drain i{display:block;height:100%;background:var(--cl);width:100%}
.s.rest .sigue{font-size:18px;font-weight:550;max-width:22em;color:#D3D8DC}
.s.rest .sigue b{color:#fff;font-weight:800}
.s.rest .acc{padding:20px var(--pad) calc(18px + env(safe-area-inset-bottom));display:grid;gap:10px}
.s.rest .btn{background:#fff;color:var(--ink)}
.s.rest .btn.suave{background:transparent;border-color:#fff;color:#fff}

.s.cardio .cabeza h2{margin-bottom:10px}
.s.cardio .cabeza p{font-size:18px;font-weight:550;max-width:24em}
.cardio .gran{font-weight:900;font-stretch:125%;font-size:clamp(88px,30vw,150px);letter-spacing:-.045em;line-height:1;margin:22px 0 4px;font-variant-numeric:tabular-nums}
.cardio .quedan{font-weight:650;font-size:16px}
.cseg{display:flex;gap:3px;padding:0 var(--pad) 18px}
.cs{height:16px;background:rgba(0,0,0,.18);border-radius:5px;overflow:hidden;flex:var(--m) 1 0}
.cs.act{outline:3px solid var(--ink);outline-offset:2px}
.cs i{display:block;height:100%;width:0;background:var(--ink)}
.s.cardio .acc{padding:0 var(--pad) calc(20px + env(safe-area-inset-bottom))}

.s.fin .cabeza{display:flex;flex-direction:column;justify-content:center}
.s.fin h2{font-size:clamp(44px,14vw,72px);margin-bottom:14px}
.s.fin p{font-size:20px;font-weight:600}
.s.fin .acc{padding:0 var(--pad) calc(20px + env(safe-area-inset-bottom));display:grid;gap:10px}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:650;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.btn:active{transform:none}}
@media (min-width:640px){body{max-width:520px;margin:0 auto}#nav{max-width:520px;margin:0 auto}}

<body>
<div id="app"></div>
<nav id="nav" aria-label="Secciones">
  <button data-a="tab" data-v="hoy">Hoy</button>
  <button data-a="tab" data-v="plan">Semana</button>
  <button data-a="tab" data-v="peso">Peso</button>
</nav>
<div id="ses" role="dialog" aria-modal="true" aria-label="Sesión de entrenamiento"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(()=>{
'use strict';

/* ---------- utilidades ---------- */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+pad(s%60)};
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=f=>{const a=f.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const hoy=()=>ymd(new Date());
const kgTxt=(n,signo)=>{const t=Math.abs(n).toFixed(1).replace('.',',');if(!signo)return(n<0?'−':'')+t;return(n>0.049?'+':n<-0.049?'−':'')+t};
const DIASL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const LETRAS={1:'L',2:'M',3:'M',4:'J',5:'V',6:'S',0:'D'};
const ORDEN=[1,2,3,4,5,6,0];
const lunesDe=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const restTxt=d=>d>=60?fmt(d)+' min':d+' s';

/* ---------- datos del plan ---------- */
const COL={
  rojo:['#D6252B','#fff','#FF6B70'],
  azul:['#1D4FA0','#fff','#86AAFF'],
  verde:['#17783F','#fff','#4FD688'],
  amarillo:['#F4C20D','#14171A','#F4C20D'],
  gris:['#C9CDD1','#14171A','#C9CDD1']
};
const E=(n,g,s,rep,d,pasos)=>({n,g,s,rep,d,pasos});
const F=(n,min,txt)=>({n,min,txt});

const intervalos=[];
for(let i=0;i<4;i++){
  intervalos.push(F('Trote suave',3,'Trotá despacio, a un ritmo que puedas sostener.'));
  intervalos.push(F('Caminata rápida',2,'Recuperá el aire sin parar de caminar.'));
}

const PLAN={
 0:{tipo:'descanso',col:'gris',titulo:'Descanso',
    nota:'El músculo crece mientras descansás. Tomá agua, dormí bien y llegá con energía al lunes.'},
 1:{tipo:'pesas',col:'rojo',titulo:'Pecho, tríceps y hombro',ej:[
   E('Press banca plano','Pecho',4,'8 a 10 repeticiones',90,['Acostate con los pies firmes en el piso y los omóplatos juntos hacia atrás.','Bajá la barra controlado hasta rozar el pecho, tardando unos 2 segundos.','Empujá hacia arriba sin despegar la espalda del banco ni rebotar la barra.']),
   E('Press inclinado con mancuernas','Pecho',3,'10 repeticiones',90,['Banco a 30 grados. Mancuernas a la altura del pecho, codos a unos 45 grados del cuerpo.','Empujá hasta estirar los brazos, sin chocar las mancuernas arriba.','Bajá lento hasta sentir el estiramiento en el pecho.']),
   E('Aperturas con mancuernas o poleas','Pecho',3,'12 repeticiones',60,['Brazos casi estirados, con los codos apenas flexionados.','Abrí hasta sentir el pecho estirado, sin bajar más que los hombros.','Cerrá juntando las manos, como si abrazaras un tronco.']),
   E('Press militar con mancuernas','Hombro',3,'10 repeticiones',90,['Sentado con la espalda apoyada y los abdominales firmes.','Empujá las mancuernas hacia arriba hasta casi juntarlas.','Bajá hasta la altura de las orejas, sin arquear la espalda.']),
   E('Elevaciones laterales','Hombro',3,'15 repeticiones',45,['De pie, mancuernas a los costados y el torso firme.','Subí los brazos hasta la altura de los hombros, con el codo apenas flexionado.','Bajá en 2 segundos, sin balancear el cuerpo.']),
   E('Tríceps en polea con soga','Tríceps',3,'12 repeticiones',60,['Mantené los codos pegados a las costillas todo el movimiento.','Estirá los brazos hacia abajo y separá la soga al final.','Subí despacio hasta que los antebrazos queden en horizontal.']),
   E('Extensión de tríceps sobre la cabeza','Tríceps',3,'12 repeticiones',60,['Tomá una mancuerna con las dos manos y subila sobre la cabeza.','Bajá detrás de la nuca flexionando solo los codos.','Estirá los brazos de nuevo sin abrir los codos.'])
 ]},
 2:{tipo:'cardio',col:'amarillo',titulo:'Cardio: caminata rápida',sub:'Caminata rápida y constante, sin correr.',fases:[
   F('Calentamiento',5,'Caminá a paso normal y soltá el cuerpo.'),
   F('Ritmo fuerte',20,'Caminata rápida. Tenés que poder hablar, pero con esfuerzo.'),
   F('Vuelta a la calma',5,'Bajá el ritmo de a poco hasta caminar tranquilo.')]},
 3:{tipo:'pesas',col:'azul',titulo:'Espalda, bíceps y hombro posterior',ej:[
   E('Jalón al pecho','Espalda',4,'10 repeticiones',90,['Agarre un poco más ancho que los hombros y el pecho hacia adelante.','Tirá la barra hacia la parte alta del pecho, llevando los codos hacia abajo.','Volvé arriba controlando, sin que el peso te tire de los hombros.']),
   E('Remo con mancuerna a una mano','Espalda',3,'10 repeticiones por lado',75,['Apoyá una mano y una rodilla en el banco, con la espalda recta.','Tirá la mancuerna hacia la cadera, llevando el codo hacia atrás.','Bajá lento hasta estirar el brazo. Hacé las series de cada lado.']),
   E('Remo en polea baja','Espalda',3,'12 repeticiones',75,['Sentado con la espalda recta y las rodillas apenas flexionadas.','Llevá el agarre hacia el abdomen, juntando los omóplatos.','Volvé estirando los brazos sin encorvar la espalda.']),
   E('Face pull','Hombro posterior',3,'15 repeticiones',45,['Polea a la altura de la cara, con agarre de soga.','Tirá hacia la frente abriendo los codos hacia los costados.','Mantené un segundo atrás y volvé lento. Usá poco peso.']),
   E('Curl con barra','Bíceps',3,'10 repeticiones',60,['De pie, con los codos pegados al cuerpo.','Subí la barra sin balancear la espalda.','Bajá en 2 segundos hasta estirar del todo.']),
   E('Curl martillo','Bíceps',3,'12 repeticiones',60,['Mancuernas con las palmas enfrentadas, como sosteniendo un martillo.','Subí una mancuerna por vez sin mover el codo.','Bajá controlado y alterná los brazos.'])
 ]},
 4:{tipo:'cardio',col:'amarillo',titulo:'Cardio: trote y caminata',sub:'Intervalos de trote suave y caminata rápida.',fases:[
   F('Calentamiento',5,'Caminá a paso normal y soltá el cuerpo.'),
   ...intervalos,
   F('Vuelta a la calma',5,'Bajá el ritmo de a poco hasta caminar tranquilo.')]},
 5:{tipo:'pesas',col:'verde',titulo:'Piernas y core',cardioOpc:true,ej:[
   E('Sentadilla','Piernas',4,'8 a 10 repeticiones',120,['Pies al ancho de los hombros y la barra firme sobre la espalda alta (o una mancuerna al pecho).','Bajá llevando la cadera hacia atrás hasta que los muslos queden paralelos al piso.','Subí empujando con todo el pie, con las rodillas alineadas con las puntas.']),
   E('Prensa de piernas','Piernas',3,'12 repeticiones',90,['Espalda y cadera bien apoyadas, pies al ancho de los hombros.','Bajá hasta unos 90 grados de rodilla, sin despegar la cadera.','Empujá sin trabar las rodillas al estirar.']),
   E('Peso muerto rumano','Femorales',3,'10 repeticiones',90,['Barra o mancuernas pegadas a las piernas, rodillas apenas flexionadas.','Llevá la cadera hacia atrás y bajá hasta sentir la parte de atrás de los muslos.','Subí empujando la cadera hacia adelante, con la espalda siempre recta.']),
   E('Zancadas','Piernas',3,'10 repeticiones por pierna',75,['Dá un paso largo hacia adelante con el torso erguido.','Bajá hasta que las dos rodillas queden a unos 90 grados.','Volvé empujando con el pie de adelante. Hacé las series de cada pierna.']),
   E('Curl femoral','Femorales',3,'12 repeticiones',60,['Ajustá la máquina y alineá las rodillas con el eje.','Llevá los talones hacia la cola sin levantar la cadera.','Volvé lento, en 2 o 3 segundos.']),
   E('Elevación de talones','Gemelos',3,'15 repeticiones',45,['Apoyá la punta de los pies en un escalón o en la máquina.','Subí lo más alto que puedas y pausá un segundo.','Bajá estirando bien el gemelo.']),
   E('Plancha','Core',3,'40 segundos',45,['Apoyá antebrazos y puntas de pie, con el cuerpo en línea recta.','Apretá abdomen y glúteos, sin dejar caer la cadera.','Respirá normal y aguantá el tiempo indicado.'])
 ]},
 6:{tipo:'cardio',col:'amarillo',titulo:'Cardio: caminata con subidas',sub:'Caminata rápida buscando alguna subida.',fases:[
   F('Calentamiento',5,'Caminá a paso normal y soltá el cuerpo.'),
   F('Ritmo fuerte con subidas',20,'Si hay una cuesta cerca, usala. Mantené el paso firme.'),
   F('Vuelta a la calma',5,'Bajá el ritmo de a poco hasta caminar tranquilo.')]}
};
const EXTRA={tipo:'cardio',col:'amarillo',titulo:'Cardio corto',sub:'Un cierre suave después de las piernas.',fases:[
  F('Caminata suave',3,'Caminá tranquilo para aflojar las piernas.'),
  F('Caminata rápida',10,'Paso firme y constante.'),
  F('Vuelta a la calma',2,'Bajá el ritmo y respirá hondo.')]};

function resumen(p){
  if(p.tipo==='pesas'){
    let t=0,s=0;p.ej.forEach(e=>{s+=e.s;t+=e.s*45+e.s*e.d+30});
    const l=p.ej[p.ej.length-1];t-=l.d+30;
    return{min:Math.round(t/300)*5,ej:p.ej.length,series:s};
  }
  if(p.tipo==='cardio')return{min:p.fases.reduce((a,f)=>a+f.min,0)};
  return{};
}
const colorDe=p=>COL[p.col];
const estiloCol=p=>{const c=colorDe(p);return `--c:${c[0]};--t:${c[1]};--cl:${c[2]}`};

/* ---------- almacenamiento ---------- */
const KEY='forja_v1';
let memoria=null;
function cargar(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.pesos))return o}}catch(e){}
  return memoria||{pesos:[{f:hoy(),kg:90}],sesiones:[],aj:{inicio:90,meta:84},hint:true};
}
let S=cargar();
function guardar(){memoria=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- peso: estadísticas ---------- */
function pesoStats(){
  const P=[...S.pesos].sort((a,b)=>a.f<b.f?-1:a.f>b.f?1:0);
  const last=P[P.length-1],first=P[0];
  const ini=S.aj.inicio,meta=S.aj.meta;
  const lun=ymd(lunesDe(new Date()));
  let ref=null;for(const x of P){if(x.f<lun)ref=x}
  if(!ref&&P.length>1)ref=first;
  const sem=ref&&ref!==last?last.kg-ref.kg:null;
  const dias=(parse(last.f)-parse(first.f))/864e5;
  const rate=dias>=7?(first.kg-last.kg)/(dias/7):null;
  const den=ini-meta;
  const pct=den>0?Math.max(0,Math.min(1,(ini-last.kg)/den)):0;
  return{P,last,first,ini,meta,total:ini-last.kg,sem,rate,pct};
}
function consejo(s){
  if(s.last.kg<=s.meta)return{c:'verde',t:`Llegaste a tu meta de ${kgTxt(s.meta)} kg. Ahora el objetivo es mantenerla.`};
  if(s.P.length<2)return{c:'amarillo',t:'Cargá tu peso una vez por semana, siempre el mismo día y en ayunas. Con dos o tres registros se arma la tendencia.'};
  if(s.rate===null)return{c:'amarillo',t:'Todavía es pronto para medir el ritmo. Seguí cargando tu peso cada semana.'};
  if(s.rate<0)return{c:'amarillo',t:'Tu peso está por encima del inicial. Es normal que varíe; mirá la tendencia de dos o tres semanas antes de cambiar algo.'};
  if(s.rate<0.3)return{c:'amarillo',t:`Bajás ${kgTxt(s.rate)} kg por semana, menos de lo esperado. Probá reemplazar la comida chatarra de la tarde y no saltear el cardio.`};
  if(s.rate<=1)return{c:'verde',t:`Ritmo sano: bajás ${kgTxt(s.rate)} kg por semana. Seguí así.`};
  return{c:'rojo',t:`Bajás ${kgTxt(s.rate)} kg por semana, que es rápido. Comé suficiente proteína y no recortes más.`};
}

/* ---------- vistas ---------- */
const V={tab:'hoy',pd:new Date().getDay()};

function sesionesSemana(){
  const lun=ymd(lunesDe(new Date()));
  return S.sesiones.filter(x=>x.k!=='extra'&&x.f>=lun).length;
}
function hechoEl(fecha){return S.sesiones.some(x=>x.k!=='extra'&&x.f===fecha)}

function vHoy(){
  const now=new Date(),dow=now.getDay(),p=PLAN[dow],r=resumen(p);
  const fechaTxt=`${DIASL[dow][0].toUpperCase()+DIASL[dow].slice(1)} ${now.getDate()} de ${MESES[now.getMonth()]}`;
  let hero;
  if(p.tipo==='descanso'){
    hero=`<section class="hero" style="${estiloCol(p)}"><h1 class="disp">Hoy descansás</h1><p>${p.nota}</p><button class="btn ink" data-a="pdia" data-k="1">Ver el entrenamiento del lunes</button></section>`;
  }else if(p.tipo==='pesas'){
    hero=`<section class="hero" style="${estiloCol(p)}"><h1 class="disp">${p.titulo}</h1><p>Unos ${r.min} minutos, ${r.ej} ejercicios, ${r.series} series.</p><button class="btn ink" data-a="start" data-k="${dow}">Empezar entrenamiento</button></section>`;
  }else{
    hero=`<section class="hero" style="${estiloCol(p)}"><h1 class="disp">${p.titulo}</h1><p>${r.min} minutos. ${p.sub}</p><button class="btn ink" data-a="start" data-k="${dow}">Empezar cardio</button></section>`;

  const lun=lunesDe(now);

    return `<button class="wd${done?' done':''}${esHoy?' hoy':''}" style="${estiloCol(PLAN[d])}" data-a="pdia" data-k="${d}" aria-label="${DIASL[d]}${done?', hecho':''}"><i></i><span>${LETRAS[d]}</span></button>`;
  }).join('');
  const s=pesoStats();
  const falta=s.last.kg-s.meta;
  const hint=(S.hint!==false&&!esInstalada())?`<div class="hint">Para usar Forja sin internet, abrí el menú del navegador y elegí “Agregar a pantalla de inicio”.<br><button data-a="hint">Entendido</button></div>`:'';
  return `<div class="top"><span class="fecha">${fechaTxt}</span><span class="marca">Forja</span></div>
  ${hero}
  <div class="week">${tira}</div>
  <p class="semtxt">${sesionesSemana()} de 6 sesiones esta semana</p>
  <section class="bloque"><button class="link" data-a="tab" data-v="peso"><h2>Peso actual</h2>
    <div class="kgbig num">${kgTxt(s.last.kg)}<small>kg</small></div>
    <div class="barra"><i style="width:${Math.round(s.pct*100)}%"></i></div>
    <p>${falta>0?`Faltan ${kgTxt(falta)} kg para llegar a ${kgTxt(s.meta)} kg.`:'Llegaste a tu meta.'}</p></button></section>
  ${hint}`;
}

function vPlan(){

function grafico(s){
  const P=s.P,W=340,H=190,L=34,R=14,T=14,B=26;
  const vs=P.map(x=>x.kg).concat([s.meta,s.ini]);
  let lo=Math.floor(Math.min(...vs)-1),hi=Math.ceil(Math.max(...vs)+1);
  if(hi-lo<4)hi=lo+4;
  const t0=parse(P[0].f).getTime(),t1=parse(P[P.length-1].f).getTime();
  const span=Math.max(t1-t0,14*864e5);
  const X=t=>L+(t-t0)/span*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const paso=(hi-lo)>12?4:(hi-lo)>6?2:1;
  let g='';
  for(let v=lo;v<=hi;v+=paso)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#C3C8CC"/><text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${v}</text>`;
  const ym=Y(s.meta).toFixed(1);
  g+=`<line x1="${L}" x2="${W-R}" y1="${ym}" y2="${ym}" stroke="#17783F" stroke-width="2.5" stroke-dasharray="7 5"/><text x="${W-R}" y="${(Y(s.meta)-6).toFixed(1)}" text-anchor="end" fill="#17783F" style="font-weight:700">Meta ${kgTxt(s.meta)}</text>`;
  const pts=P.map(x=>[X(parse(x.f).getTime()),Y(x.kg)]);
  if(pts.length>1)g+=`<path d="${pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ')}" fill="none" stroke="#14171A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((q,i)=>{const u=i===pts.length-1;g+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${u?7:4.5}" fill="${u?'#D6252B':'#14171A'}"/>`});
  const dm=f=>{const d=parse(f);return d.getDate()+'/'+(d.getMonth()+1)};
  g+=`<text x="${L}" y="${H-6}">${dm(P[0].f)}</text>`;
  if(P.length>1)g+=`<text x="${W-R}" y="${H-6}" text-anchor="end">${dm(P[P.length-1].f)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de tu peso a lo largo del tiempo">${g}</svg>`;
}

      <div class="sep"></div><button class="btn suave" data-a="restaurar">Restaurar datos</button>

function esInstalada(){
  try{return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}
}

function render(){
  $('app').innerHTML=V.tab==='hoy'?vHoy():V.tab==='plan'?vPlan():vPeso();
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===V.tab?'page':'false'));
}

function aviso(t){
  const e=$('toast');e.textContent=t;e.classList.add('on');
  clearTimeout(aviso.t);aviso.t=setTimeout(()=>e.classList.remove('on'),2400);
}

/* ---------- sonido, vibración, pantalla encendida ---------- */
let ac=null,wl=null;
function audio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(f,d,n){
  if(!ac)return;n=n||1;
  for(let i=0;i<n;i++){
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='square';o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ac.destination);
    const t=ac.currentTime+i*(d+.09);o.start(t);o.stop(t+d);
  }
}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
async function pedirWake(){try{if('wakeLock' in navigator)wl=await navigator.wakeLock.request('screen')}catch(e){}}
function soltarWake(){try{wl&&wl.release()}catch(e){}wl=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ses&&ses.fase!=='fin')pedirWake()});

/* ---------- sesión guiada ---------- */
let ses=null;

function empezar(k){
  const p=k==='extra'?EXTRA:PLAN[k];
  if(!p||p.tipo==='descanso')return;
  audio();pedirWake();
  if(p.tipo==='pesas'){
    ses={tipo:'pesas',k,p,ei:0,si:0,fase:'trabajo',t0:Date.now(),restEnd:0,restTotal:0,sig:null,lb:0};
  }else{
    const st=[];let a=0;p.fases.forEach(f=>{st.push(a);a+=f.min*60});
    ses={tipo:'cardio',k,p,acc:0,last:Date.now(),paused:false,fi:0,st,total:a,fase:'trabajo'};
  }
  renderSes();
}

function discos(n,hechas){
  const max=Math.max(n,1),W=320,H=100;
  let g=`<rect x="0" y="47" width="${W}" height="7" rx="3" fill="rgba(0,0,0,.35)"/><rect x="52" y="30" width="10" height="41" rx="3" fill="rgba(0,0,0,.55)"/>`;
  for(let i=0;i<n;i++){
    const h=n>1?86-i*(44/(n-1)):70,x=70+i*22,y=50.5-h/2;
    const hecho=i<hechas;
    g+=`<rect x="${x}" y="${y.toFixed(1)}" width="16" height="${h.toFixed(1)}" rx="5" style="fill:${hecho?'#14171A':'var(--c)'}" stroke="#14171A" stroke-width="2.5"/>`;
  }
  const fin=70+n*22+2;
  g+=`<rect x="${fin}" y="38" width="9" height="25" rx="3" fill="rgba(0,0,0,.55)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${g}</svg>`;
}

function renderSes(){
  const el=$('ses');
  if(!ses){el.classList.remove('on');el.innerHTML='';return}
  el.classList.add('on');
  const p=ses.p,st=estiloCol(p);
  let h='';
  if(ses.fase==='fin'){
    const mins=Math.max(1,Math.round(ses.seg/60));
    const extra=(ses.tipo==='pesas'&&p.cardioOpc)?`<button class="btn ink" data-a="extra">Sumar cardio corto de 15 minutos</button>`:'';
    h=`<div class="s fin" style="${st}"><div class="cabeza"><h2 class="disp">Sesión terminada</h2><p>Entrenaste ${mins} ${mins===1?'minuto':'minutos'}. Quedó guardada en tu semana.</p></div><div class="acc">${extra}<button class="btn ${extra?'suave':'ink'}" style="${extra?'color:var(--t);border-color:var(--t)':''}" data-a="cerrar">Listo</button></div></div>`;
  }else if(ses.tipo==='pesas'&&ses.fase==='trabajo'){
    const ex=p.ej[ses.ei];
    const seg=p.ej.map((_,i)=>`<i class="${i<ses.ei?'d':i===ses.ei?'c':''}"></i>`).join('');
    h=`<div class="s work" style="${st}">
      <div class="stop"><button data-a="salir">Salir</button><span class="reloj num" id="tt">0:00</span></div>
      <div class="seg" aria-label="Ejercicio ${ses.ei+1} de ${p.ej.length}">${seg}</div>
      <div class="cabeza"><div class="grupo">${ex.g}</div><h2 class="disp">${ex.n}</h2>
        <div class="barra-disco">${discos(ex.s,ses.si)}</div>
        <div class="serie">Serie ${ses.si+1} de ${ex.s}: ${ex.rep}</div></div>
      <div class="pie"><ol>${ex.pasos.map(x=>`<li>${x}</li>`).join('')}</ol>
        <button class="btn ink" data-a="hecha">Serie hecha</button>
        <button class="txt" data-a="saltar">Saltar este ejercicio</button></div></div>`;
  }else if(ses.tipo==='pesas'){
    const sx=p.ej[ses.sig.ei];
    h=`<div class="s rest" style="${st}">
      <div class="stop"><button data-a="salir">Salir</button><span class="reloj num" id="tt">0:00</span></div>
      <div class="medio"><div class="lbl">Descansá</div><div class="big" id="rt">${fmt(ses.restTotal)}</div>
        <div class="drain"><i id="rb"></i></div>
        <p class="sigue">Sigue: <b>${sx.n}</b>, serie ${ses.sig.si+1} de ${sx.s}.</p></div>
      <div class="acc"><button class="btn" data-a="mas15">Sumar 15 segundos</button><button class="btn suave" data-a="skip">Saltar descanso</button></div></div>`;
  }else{
    const fi=ses.fi,f=p.fases[fi];
    const segs=p.fases.map((x,i)=>`<div class="cs${i===fi?' act':''}" style="--m:${x.min}"><i id="cf${i}"></i></div>`).join('');
    h=`<div class="s cardio" style="${st}">
      <div class="stop"><button data-a="salir">Salir</button><span class="reloj num" id="tt">0:00</span></div>
      <div class="cabeza"><div class="grupo">Tramo ${fi+1} de ${p.fases.length}</div><h2 class="disp">${f.n}</h2><p>${f.txt}</p>
        <div class="gran" id="ct">0:00</div><div class="quedan" id="cq"></div></div>
      <div class="cseg">${segs}</div>
      <div class="acc"><button class="btn ink" data-a="pausa" id="bp">${ses.paused?'Seguir':'Pausar'}</button></div></div>`;
  }
  el.innerHTML=h;el.scrollTop=0;
  onTick();
}

function onTick(){
  if(!ses||ses.fase==='fin')return;
  const now=Date.now();
  if(ses.tipo==='pesas'){
    const tt=$('tt');if(tt)tt.textContent=fmt((now-ses.t0)/1000);
    if(ses.fase==='descanso'){
      const rem=(ses.restEnd-now)/1000;
      const rt=$('rt');if(rt)rt.textContent=fmt(Math.ceil(Math.max(0,rem)));
      const rb=$('rb');if(rb)rb.style.width=Math.max(0,Math.min(100,rem/ses.restTotal*100))+'%';
      const s=Math.ceil(rem);
      if(s<=3&&s>0&&s!==ses.lb){ses.lb=s;beep(660,.1)}
      if(rem<=0)terminarDescanso();
    }
  }else{
    const el=ses.acc+(ses.paused?0:(now-ses.last)/1000);
    const tt=$('tt');if(tt)tt.textContent=fmt(el);
    if(el>=ses.total){ses.acc=ses.total;finalizar();return}
    let idx=0;for(let i=0;i<ses.st.length;i++){if(el>=ses.st[i])idx=i}
    if(idx!==ses.fi){ses.fi=idx;beep(880,.18,2);vib([200,100,200]);renderSes();return}
    const f=ses.p.fases[idx],ini=ses.st[idx],dur=f.min*60;
    const ct=$('ct');if(ct)ct.textContent=fmt(Math.ceil(ini+dur-el));
    const cq=$('cq');if(cq)cq.textContent=ses.paused?'En pausa':'Quedan '+fmt(Math.ceil(ses.total-el))+' en total';
    ses.p.fases.forEach((x,i)=>{const e=$('cf'+i);if(e){const pc=Math.max(0,Math.min(1,(el-ses.st[i])/(x.min*60)));e.style.width=(pc*100)+'%'}});
  }
}
setInterval(onTick,250);

function empDesc(d){
  ses.fase='descanso';ses.restTotal=d;ses.restEnd=Date.now()+d*1000;ses.lb=0;
  vib(60);renderSes();
}
function terminarDescanso(){
  beep(988,.22,2);vib([200,100,200]);
  ses.ei=ses.sig.ei;ses.si=ses.sig.si;ses.fase='trabajo';renderSes();
}
function hecha(){
  const ex=ses.p.ej[ses.ei],hechas=ses.si+1;
  if(hechas<ex.s){ses.sig={ei:ses.ei,si:hechas};empDesc(ex.d)}
  else if(ses.ei<ses.p.ej.length-1){ses.sig={ei:ses.ei+1,si:0};empDesc(ex.d)}
  else finalizar();
}
function saltar(){
  if(ses.ei<ses.p.ej.length-1){ses.ei++;ses.si=0;renderSes()}else finalizar();
}
function finalizar(){
  const seg=ses.tipo==='pesas'?Math.round((Date.now()-ses.t0)/1000):Math.round(ses.acc+(ses.paused?0:(Date.now()-ses.last)/1000));
  ses.seg=seg;ses.fase='fin';
  S.sesiones.push({f:hoy(),k:ses.k,seg});guardar();
  soltarWake();beep(784,.15,1);setTimeout(()=>beep(1046,.3,1),260);vib([300,120,300,120,500]);
  renderSes();
}
function cerrarSes(){ses=null;soltarWake();renderSes();render()}

/* ---------- acciones ---------- */
function leerNum(txt){const n=parseFloat(String(txt).replace(',','.'));return isNaN(n)?null:n}
async function copiar(txt,ok){
  try{await navigator.clipboard.writeText(txt);aviso(ok)}
  catch(e){window.prompt('Copiá este texto:',txt)}
}
function textoResumen(){
  const s=pesoStats();
  const ult=s.P.slice(-6).map(x=>{const d=parse(x.f);return `${d.getDate()}/${d.getMonth()+1}: ${kgTxt(x.kg)} kg`}).join('; ');
  return `Hola Claude, este es mi resumen de la semana en Forja.\n`+
    `Sesiones completadas esta semana: ${sesionesSemana()} de 6.\n`+
    `Peso actual: ${kgTxt(s.last.kg)} kg. Peso inicial: ${kgTxt(s.ini)} kg. Meta: ${kgTxt(s.meta)} kg.\n`+
    `Cambio esta semana: ${s.sem===null?'sin datos':kgTxt(s.sem,true)+' kg'}. Ritmo promedio: ${s.rate===null?'sin datos':kgTxt(s.rate)+' kg por semana'}.\n`+
    `Últimos registros: ${ult}.\n`+
    `Entreno pesas lunes, miércoles y viernes (máximo 1 hora) y hago cardio afuera martes, jueves y sábado.\n`+
    `¿Qué ajustes me recomendás para la semana que viene?`;
}

function accion(a,b){
  switch(a){
    case 'tab':V.tab=b.dataset.v;render();window.scrollTo(0,0);break;
    case 'pdia':V.pd=Number(b.dataset.k);V.tab='plan';render();window.scrollTo(0,0);break;
    case 'start':empezar(Number(b.dataset.k));break;
    case 'extra':{const t=ses;ses=null;soltarWake();empezar('extra');break}
    case 'salir':if(window.confirm('¿Salir de la sesión? Lo que hiciste hasta ahora no se guarda.')){cerrarSes()}break;
    case 'hecha':hecha();break;
    case 'saltar':saltar();break;
    case 'mas15':ses.restEnd+=15000;ses.restTotal+=15;renderSes();break;
    case 'skip':terminarDescanso();break;
    case 'pausa':
      if(ses.paused){ses.last=Date.now();ses.paused=false}
      else{ses.acc+=(Date.now()-ses.last)/1000;ses.paused=true}
      {const bp=$('bp');if(bp)bp.textContent=ses.paused?'Seguir':'Pausar'}
      onTick();break;
    case 'cerrar':cerrarSes();break;
    case 'hint':S.hint=false;guardar();render();break;
    case 'gpeso':{
      const kg=leerNum($('inKg').value),f=$('inF').value||hoy();
      if(kg===null||kg<30||kg>250){aviso('Escribí un peso entre 30 y 250 kg.');return}
      if(f>hoy()){aviso('La fecha no puede ser futura.');return}
      S.pesos=S.pesos.filter(x=>x.f!==f);S.pesos.push({f,kg:Math.round(kg*10)/10});guardar();render();aviso('Peso guardado.');break}
    case 'bpeso':
      if(S.pesos.length<=1){aviso('Tiene que quedar al menos un registro.');return}
      if(window.confirm('¿Quitar este registro?')){S.pesos=S.pesos.filter(x=>x.f!==b.dataset.f);guardar();render()}
      break;
    case 'gaj':{
      const i=leerNum($('aIni').value),m=leerNum($('aMeta').value);
      if(i===null||m===null||m>=i){aviso('La meta tiene que ser menor que el peso inicial.');return}
      S.aj={inicio:i,meta:m};guardar();render();aviso('Ajustes guardados.');break}
    case 'resumen':copiar(textoResumen(),'Resumen copiado. Pegalo en Claude.');break;
    case 'copiar':copiar(JSON.stringify(S),'Datos copiados.');break;
    case 'restaurar':{
      try{
        const o=JSON.parse($('rest').value);
        if(!o||!Array.isArray(o.pesos)||!o.pesos.length||!o.aj)throw 0;
        S={pesos:o.pesos,sesiones:Array.isArray(o.sesiones)?o.sesiones:[],aj:o.aj,hint:o.hint};guardar();render();aviso('Datos restaurados.');
      }catch(e){aviso('Ese texto no es una copia válida.')}
      break}
  }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)accion(b.dataset.a,b)});

render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
</script>
</body>
</html>
